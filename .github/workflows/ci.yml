name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Go is pinned with the linter: a new Go release can change the export data
      # format, which a pinned golangci-lint then cannot read (Go 1.27.4 broke
      # v2.13.2). Bump both together; 1.26.x is the go.mod minimum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - run: test -z "$(gofmt -l .)"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.x', 'stable']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      # The examples and the test helpers have no tests: build them, and run the
      # coverage profile over every package that has tests. A package without
      # tests would count as 0%, or fail the command ("no such tool covdata")
      # although every test passed.
      - run: go build ./...
      - run: |
          go test -race -coverprofile=cover.out \
            $(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./...)
      - name: Coverage gate (90%)
        if: matrix.go-version == 'stable'
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t+0 < 90) }'

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
